<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#0f172a">
  <link rel="manifest" href="manifest.json">
  <title>ЖКХ Частный дом</title>
  <style>
    :root {
      --bg: #0f172a; --card: #1e293b; --card-border: #334155;
      --text: #f8fafc; --muted: #94a3b8;
      --gazprom: #0079c2; --tatenergo: #f97316;
      --unpaid-bg: #ffffff; --unpaid-text: #0f172a; --unpaid-border: #cbd5e1;
      --paid-bg: #16a34a; --paid-text: #ffffff; --paid-border: #15803d;
    }
    * { box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background: var(--bg); color: var(--text); margin: 0; padding: 12px; padding-bottom: 40px; }
    .container { max-width: 540px; margin: 0 auto; }

    .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; }
    .header h1 { font-size: 1.25rem; margin: 0; display: flex; align-items: center; gap: 8px; }
    .btn-icon { background: var(--card); border: 1px solid var(--card-border); color: var(--text); padding: 8px 12px; border-radius: 10px; cursor: pointer; font-size: 14px; }

    /* Вкладки */
    .tabs { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; background: var(--card); padding: 5px; border-radius: 12px; margin-bottom: 16px; border: 1px solid var(--card-border); }
    .tab-btn { background: transparent; border: none; color: var(--muted); padding: 10px; border-radius: 9px; font-size: 14px; font-weight: 700; cursor: pointer; transition: 0.2s; }
    .tab-btn.active { background: #2563eb; color: #fff; box-shadow: 0 2px 8px rgba(37, 99, 235, 0.4); }

    .period-bar { display: grid; grid-template-columns: 1fr 1.5fr; gap: 10px; margin-bottom: 14px; }
    select, input { background: #0f172a; border: 1px solid var(--card-border); color: var(--text); padding: 10px 12px; border-radius: 10px; font-size: 16px; width: 100%; }
    input:focus, select:focus { outline: none; border-color: #38bdf8; }
    input[readonly] { background: rgba(15, 23, 42, 0.45); color: #94a3b8; border-color: #1e293b; }

    .provider-card { background: var(--card); border: 1px solid var(--card-border); border-radius: 16px; padding: 16px; margin-bottom: 16px; position: relative; overflow: hidden; }
    .provider-card::before { content: ""; position: absolute; top: 0; left: 0; width: 5px; height: 100%; }
    .card-gazprom::before { background: var(--gazprom); }
    .card-tatenergo::before { background: var(--tatenergo); }

    .provider-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 14px; }
    .logo-wrap { display: flex; align-items: center; gap: 10px; font-weight: 700; font-size: 1.05rem; }
    .logo-badge { width: 34px; height: 34px; border-radius: 8px; display: flex; align-items: center; justify-content: center; background: #fff; padding: 4px; }

    .grid-3 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 8px; margin-bottom: 10px; }
    .field label { display: block; font-size: 10px; color: var(--muted); margin-bottom: 4px; text-transform: uppercase; letter-spacing: 0.4px; }

    .calc-footer { display: flex; justify-content: space-between; align-items: center; background: rgba(15, 23, 42, 0.6); padding: 12px; border-radius: 12px; margin-top: 10px; }
    .calc-info { font-size: 13px; color: var(--muted); }
    .calc-sum { font-size: 1.25rem; font-weight: 800; color: #fff; }

    /* Индикатор оплаты (Белый = не оплачен, Зеленый = оплачен) */
    .pay-toggle { display: flex; align-items: center; gap: 6px; padding: 8px 12px; border-radius: 10px; border: 2px solid var(--unpaid-border); background: var(--unpaid-bg); color: var(--unpaid-text); cursor: pointer; font-weight: 700; font-size: 13px; user-select: none; transition: 0.15s; box-shadow: 0 2px 6px rgba(0,0,0,0.2); }
    .pay-toggle.is-paid { border-color: var(--paid-border); background: var(--paid-bg); color: var(--paid-text); }

    .season-banner { background: rgba(14, 165, 233, 0.15); border: 1px dashed #0284c7; color: #7dd3fc; padding: 6px 10px; border-radius: 8px; font-size: 12px; margin-bottom: 10px; display: flex; align-items: center; gap: 6px; }

    .btn-save { width: 100%; background: linear-gradient(135deg, #2563eb, #1d4ed8); color: #fff; border: none; padding: 14px; border-radius: 12px; font-size: 16px; font-weight: 700; cursor: pointer; margin-bottom: 10px; box-shadow: 0 4px 12px rgba(37, 99, 235, 0.3); }
    .btn-save:disabled { opacity: 0.5; }

    /* Аккордеон по годам в журнале */
    .year-group { background: var(--card); border: 1px solid var(--card-border); border-radius: 14px; margin-bottom: 12px; overflow: hidden; }
    .year-header { padding: 14px 16px; display: flex; justify-content: space-between; align-items: center; cursor: pointer; background: rgba(30, 41, 59, 0.9); user-select: none; }
    .year-header:hover { background: #263349; }
    .year-title { font-size: 1.05rem; font-weight: 800; display: flex; align-items: center; gap: 8px; }
    .year-meta { text-align: right; font-size: 12px; color: var(--muted); }
    .year-meta strong { display: block; font-size: 14px; color: #fff; }
    .year-body { padding: 10px; border-top: 1px solid var(--card-border); background: #0f172a; }

    .month-card { background: var(--card); border: 1px solid var(--card-border); border-radius: 10px; padding: 10px; margin-bottom: 8px; }
    .month-card:last-child { margin-bottom: 0; }
    .month-card.summer { border-left: 3px solid #0ea5e9; }
    .month-top { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; font-size: 14px; font-weight: 700; }
    .month-edit-link { font-size: 11px; color: #38bdf8; cursor: pointer; font-weight: 600; }

    /* Пустая строка месяца (еще не внесена) */
    .month-empty { background: rgba(30, 41, 59, 0.45); border: 1px dashed #334155; border-radius: 10px; padding: 10px 12px; margin-bottom: 8px; display: flex; justify-content: space-between; align-items: center; cursor: pointer; transition: 0.15s; }
    .month-empty:last-child { margin-bottom: 0; }
    .month-empty:hover { border-color: #38bdf8; background: rgba(30, 41, 59, 0.75); }
    .month-empty-name { font-size: 14px; font-weight: 600; color: var(--muted); }
    .month-empty-hint { font-size: 11px; color: #64748b; }

    /* Плашки счетов в журнале: Белые или Зеленые */
    .bills-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
    .bill-cell { padding: 9px 10px; border-radius: 8px; border: 2px solid var(--unpaid-border); background: var(--unpaid-bg); color: var(--unpaid-text); cursor: pointer; display: flex; justify-content: space-between; align-items: center; transition: 0.15s; }
    .bill-cell.paid { border-color: var(--paid-border); background: var(--paid-bg); color: var(--paid-text); }
    .bill-cell-title { font-size: 11px; opacity: 0.8; display: block; font-weight: 600; }
    .bill-cell-sum { font-size: 14px; font-weight: 800; }
    .bill-cell-icon { font-size: 15px; }

    .hidden { display: none; }
    .settings-box { background: var(--card); padding: 14px; border-radius: 12px; margin-bottom: 14px; border: 1px solid #38bdf8; }
  </style>
</head>
<body>
<div class="container">
  <div class="header">
    <h1>🏡 Журнал ЖКХ</h1>
    <div>
      <button class="btn-icon" onclick="loadData()" title="Обновить">🔄</button>
      <button class="btn-icon" onclick="toggleSettings()" title="Настройки">⚙️ Ключ</button>
    </div>
  </div>

  <div id="settingsBox" class="settings-box hidden">
    <label style="font-size:12px; color:var(--muted); display:block; margin-bottom:6px;">Ключ (URL веб-приложения Apps Script):</label>
    <input type="text" id="apiKeyInput" placeholder="https://script.google.com/macros/s/.../exec" style="margin-bottom:8px;">
    <button class="btn-save" style="margin:0; padding:10px;" onclick="saveKey()">Сохранить ключ</button>
  </div>

  <!-- Навигация по вкладкам -->
  <div class="tabs">
    <button class="tab-btn active" id="tabInputBtn" onclick="switchTab('input')">📝 Ввод показаний</button>
    <button class="tab-btn" id="tabJournalBtn" onclick="switchTab('journal')">📚 Журнал по годам</button>
  </div>

  <!-- ВКЛАДКА 1: ВВОД ПОКАЗАНИЙ -->
  <div id="viewInput">
    <div class="period-bar">
      <select id="yearSelect" onchange="onPeriodChange()"></select>
      <select id="monthSelect" onchange="onPeriodChange()"></select>
    </div>

    <!-- ГАЗПРОМ -->
    <div class="provider-card card-gazprom">
      <div class="provider-header">
        <div class="logo-wrap">
          <div class="logo-badge">
            <svg viewBox="0 0 36 36" width="24" height="24"><path fill="#0079c2" d="M18 2C13 9 11 14 11 19a7 7 0 0 0 14 0c0-5-2-10-7-17zm0 21a3 3 0 0 1-3-3c0-2 1-4 3-7 2 3 3 5 3 7a3 3 0 0 1-3 3z"/><rect x="10" y="29" width="16" height="3" rx="1.5" fill="#0079c2"/></svg>
          </div>
          <span>Газпром</span>
        </div>
        <div id="gasPayBtn" class="pay-toggle" onclick="confirmFormPay('gas')">⬜ Не оплачен</div>
      </div>

      <div class="grid-3">
        <div class="field">
          <label>Предыдущие</label>
          <input type="number" id="gasPrevRead" readonly placeholder="—">
        </div>
        <div class="field">
          <label>Текущие (м³)</label>
          <input type="number" id="gasReading" placeholder="0" oninput="recalc()">
        </div>
        <div class="field">
          <label>Тариф (₽/м³)</label>
          <input type="number" step="0.01" id="gasTariff" placeholder="9.28" oninput="recalc()">
        </div>
      </div>

      <div class="calc-footer">
        <div class="calc-info">Расход: <strong id="gasDiffText" style="color:#38bdf8; font-size:15px;">0 м³</strong></div>
        <div style="text-align:right">
          <span style="font-size:10px; color:var(--muted); display:block; text-transform:uppercase;">К оплате</span>
          <span class="calc-sum" id="gasSumText">0.00 ₽</span>
        </div>
      </div>
    </div>

    <!-- ТАТЭНЕРГОСБЫТ -->
    <div class="provider-card card-tatenergo">
      <div class="provider-header">
        <div class="logo-wrap">
          <div class="logo-badge" style="padding:2px;">
            <svg viewBox="0 0 100 100" width="28" height="28">
              <path d="M50 6 C72 6 92 22 94 45 C82 28 65 20 50 20 Z" fill="#9ca3af"/>
              <path d="M94 50 C94 72 78 92 55 94 C72 82 80 65 80 50 Z" fill="#9ca3af"/>
              <path d="M50 94 C28 94 8 78 6 55 C18 72 35 80 50 80 Z" fill="#9ca3af"/>
              <path d="M6 50 C6 28 22 8 45 6 C28 18 20 35 20 50 Z" fill="#9ca3af"/>
              <circle cx="50" cy="50" r="30" fill="#f97316"/>
              <path d="M36 37 H61 V43 H43 V47 H57 V53 H43 V57 H61 V63 H36 Z" fill="#ffffff"/>
            </svg>
          </div>
          <span>Татэнергосбыт</span>
        </div>
        <div id="tesPayBtn" class="pay-toggle" onclick="confirmFormPay('tes')">⬜ Не оплачен</div>
      </div>

      <div id="summerBanner" class="season-banner hidden">
        💧 <strong>Сезон полива (Май–Сентябрь):</strong> проверьте начисление за полив
      </div>

      <div class="grid-3">
        <div class="field">
          <label>Предыдущие</label>
          <input type="number" id="elecPrevRead" readonly placeholder="—">
        </div>
        <div class="field">
          <label>Текущие (кВт)</label>
          <input type="number" id="elecReading" placeholder="0" oninput="recalc()">
        </div>
        <div class="field">
          <label>Тариф (₽/кВт)</label>
          <input type="number" step="0.01" id="elecTariff" placeholder="4.85" oninput="recalc()">
        </div>
      </div>

      <div class="grid-3">
        <div class="field">
          <label>💧 Вода (₽)</label>
          <input type="number" step="0.01" id="waterCost" placeholder="0" oninput="recalc()">
        </div>
        <div class="field">
          <label>🗑️ ТБО (₽)</label>
          <input type="number" step="0.01" id="tboCost" placeholder="0" oninput="recalc()">
        </div>
        <div class="field">
          <label>🌱 Полив (₽)</label>
          <input type="number" step="0.01" id="wateringCost" placeholder="0" oninput="recalc()">
        </div>
      </div>

      <div class="calc-footer">
        <div class="calc-info">
          Расход: <strong id="elecDiffText" style="color:#38bdf8; font-size:15px;">0 кВт</strong><br>
          <span style="font-size:11px;">Свет: <span id="elecOnlySum">0</span> ₽ + Прочее: <span id="otherSum">0</span> ₽</span>
        </div>
        <div style="text-align:right">
          <span style="font-size:10px; color:var(--muted); display:block; text-transform:uppercase;">К оплате</span>
          <span class="calc-sum" id="tesSumText">0.00 ₽</span>
        </div>
      </div>
    </div>

    <button class="btn-save" id="saveBtn" onclick="saveRecord()">💾 Сохранить данные за месяц</button>
  </div>

  <!-- ВКЛАДКА 2: ЖУРНАЛ ПО ГОДАМ (СВЕРНУТЫЙ) -->
  <div id="viewJournal" class="hidden">
    <div id="journalAccordion">Загрузка данных...</div>
  </div>
</div>

<script>
  const MONTHS = ['Январь','Февраль','Март','Апрель','Май','Июнь','Июль','Август','Сентябрь','Октябрь','Ноябрь','Декабрь'];
  let allRows = [];
  let gasPaidState = false;
  let tesPaidState = false;
  let prevGas = 0;
  let prevElec = 0;
  let expandedYears = {};

  const now = new Date();
  expandedYears[now.getFullYear()] = true;

  const yearSel = document.getElementById('yearSelect');
  const monthSel = document.getElementById('monthSelect');

  for (let y = 2024; y <= 2030; y++) {
    yearSel.innerHTML += `<option value="${y}" ${y === now.getFullYear() ? 'selected' : ''}>${y} год</option>`;
  }
  MONTHS.forEach((m, idx) => {
    const mNum = idx + 1;
    monthSel.innerHTML += `<option value="${mNum}" ${mNum === (now.getMonth() + 1) ? 'selected' : ''}>${m}</option>`;
  });

  function switchTab(tab) {
    document.getElementById('viewInput').classList.toggle('hidden', tab !== 'input');
    document.getElementById('viewJournal').classList.toggle('hidden', tab !== 'journal');
    document.getElementById('tabInputBtn').classList.toggle('active', tab === 'input');
    document.getElementById('tabJournalBtn').classList.toggle('active', tab === 'journal');
    if (tab === 'journal') renderJournal();
  }

  function getApiUrl() { return localStorage.getItem('gkh_dom_key') || ''; }
  function toggleSettings() {
    document.getElementById('settingsBox').classList.toggle('hidden');
    document.getElementById('apiKeyInput').value = getApiUrl();
  }
  function saveKey() {
    localStorage.setItem('gkh_dom_key', document.getElementById('apiKeyInput').value.trim());
    toggleSettings();
    loadData();
  }

  // Защита от случайного нажатия на статус оплаты в форме
  function confirmFormPay(type) {
    const name = type === 'gas' ? 'Газпром' : 'Татэнергосбыт';
    const currentState = type === 'gas' ? gasPaidState : tesPaidState;
    const msg = currentState
      ? `Снять отметку об оплате (${name}) и вернуть белый статус?`
      : `Подтвердить оплату (${name}) и выделить зелёным?`;

    if (confirm(msg)) {
      if (type === 'gas') gasPaidState = !gasPaidState;
      else tesPaidState = !tesPaidState;
      updatePayButtons();
    }
  }

  function updatePayButtons() {
    const gBtn = document.getElementById('gasPayBtn');
    const tBtn = document.getElementById('tesPayBtn');
    gBtn.className = 'pay-toggle' + (gasPaidState ? ' is-paid' : '');
    gBtn.innerText = gasPaidState ? '✅ Оплачен' : '⬜ Не оплачен';
    tBtn.className = 'pay-toggle' + (tesPaidState ? ' is-paid' : '');
    tBtn.innerText = tesPaidState ? '✅ Оплачен' : '⬜ Не оплачен';
  }

  function editMonth(y, m) {
    yearSel.value = y;
    monthSel.value = m;
    onPeriodChange();
    switchTab('input');
    window.scrollTo({ top: 0, behavior: 'smooth' });
  }

  function onPeriodChange() {
    const y = Number(yearSel.value);
    const m = Number(monthSel.value);

    const banner = document.getElementById('summerBanner');
    if (m >= 5 && m <= 9) banner.classList.remove('hidden');
    else banner.classList.add('hidden');

    const sorted = [...allRows].sort((a, b) => (Number(a.Год) * 100 + Number(a.Месяц)) - (Number(b.Год) * 100 + Number(b.Месяц)));
    const curKey = y * 100 + m;

    const currentRecord = sorted.find(r => Number(r.Год) === y && Number(r.Месяц) === m);
    const prevRecords = sorted.filter(r => (Number(r.Год) * 100 + Number(r.Месяц)) < curKey);
    const lastPrev = prevRecords.length ? prevRecords[prevRecords.length - 1] : null;

    prevGas = lastPrev ? Number(lastPrev.Газ_Показ) : 0;
    prevElec = lastPrev ? Number(lastPrev.Свет_Показ) : 0;

    document.getElementById('gasPrevRead').value = prevGas || '';
    document.getElementById('elecPrevRead').value = prevElec || '';

    const savedGasTariff = (currentRecord && currentRecord.Газ_Тариф) || (lastPrev && lastPrev.Газ_Тариф) || localStorage.getItem('last_gas_tariff') || '';
    const savedElecTariff = (currentRecord && currentRecord.Свет_Тариф) || (lastPrev && lastPrev.Свет_Тариф) || localStorage.getItem('last_elec_tariff') || '';

    document.getElementById('gasTariff').value = savedGasTariff;
    document.getElementById('elecTariff').value = savedElecTariff;

    if (currentRecord) {
      document.getElementById('gasReading').value = currentRecord.Газ_Показ || '';
      document.getElementById('elecReading').value = currentRecord.Свет_Показ || '';
      document.getElementById('waterCost').value = currentRecord.Вода !== undefined ? currentRecord.Вода : '';
      document.getElementById('tboCost').value = currentRecord.ТБО !== undefined ? currentRecord.ТБО : '';
      document.getElementById('wateringCost').value = currentRecord.Полив !== undefined ? currentRecord.Полив : '';
      gasPaidState = currentRecord.Газ_Оплата === 'Да';
      tesPaidState = currentRecord.ТЭС_Оплата === 'Да';
    } else {
      document.getElementById('gasReading').value = '';
      document.getElementById('elecReading').value = '';
      document.getElementById('waterCost').value = lastPrev && lastPrev.Вода !== undefined ? lastPrev.Вода : '';
      document.getElementById('tboCost').value = lastPrev && lastPrev.ТБО !== undefined ? lastPrev.ТБО : '';
      document.getElementById('wateringCost').value = lastPrev && lastPrev.Полив !== undefined ? lastPrev.Полив : '';
      gasPaidState = false;
      tesPaidState = false;
    }

    updatePayButtons();
    recalc();
  }

  function recalc() {
    const gRead = Number(document.getElementById('gasReading').value) || 0;
    const gTar = Number(document.getElementById('gasTariff').value) || 0;
    const gDiff = (gRead >= prevGas && prevGas > 0) ? (gRead - prevGas) : 0;
    const gSum = gDiff * gTar;

    document.getElementById('gasDiffText').innerText = `${gDiff} м³`;
    document.getElementById('gasSumText').innerText = `${gSum.toFixed(2)} ₽`;

    const eRead = Number(document.getElementById('elecReading').value) || 0;
    const eTar = Number(document.getElementById('elecTariff').value) || 0;
    const eDiff = (eRead >= prevElec && prevElec > 0) ? (eRead - prevElec) : 0;
    const eSum = eDiff * eTar;

    const water = Number(document.getElementById('waterCost').value) || 0;
    const tbo = Number(document.getElementById('tboCost').value) || 0;
    const watering = Number(document.getElementById('wateringCost').value) || 0;
    const other = water + tbo + watering;
    const tesTotal = eSum + other;

    document.getElementById('elecDiffText').innerText = `${eDiff} кВт`;
    document.getElementById('elecOnlySum').innerText = eSum.toFixed(0);
    document.getElementById('otherSum').innerText = other.toFixed(0);
    document.getElementById('tesSumText').innerText = `${tesTotal.toFixed(2)} ₽`;

    return { gRead, gDiff, gTar, gSum, eRead, eDiff, eTar, eSum, water, tbo, watering, tesTotal };
  }

  async function loadData() {
    const url = getApiUrl();
    const accDiv = document.getElementById('journalAccordion');
    if (!url) {
      accDiv.innerHTML = 'Нажмите «⚙️ Ключ» вверху и вставьте ссылку на ваш Apps Script.';
      onPeriodChange();
      return;
    }
    accDiv.innerHTML = 'Синхронизация с таблицей...';
    try {
      const res = await fetch(url);
      allRows = await res.json();
      onPeriodChange();
      renderJournal();
    } catch (e) {
      accDiv.innerHTML = 'Ошибка загрузки. Проверьте ключ.';
    }
  }

  function toggleYear(y) {
    expandedYears[y] = !expandedYears[y];
    renderJournal();
  }

  function renderJournal() {
    const accDiv = document.getElementById('journalAccordion');
    const validRows = allRows.filter(r => Number(r.Год) >= 2024);

    if (!validRows.length) {
      accDiv.innerHTML = '<div style="color:var(--muted); text-align:center; padding:20px;">Записей пока нет.</div>';
      return;
    }

    const years = [...new Set(validRows.map(r => Number(r.Год)))].sort((a, b) => b - a);

    accDiv.innerHTML = years.map(y => {
      const yRows = validRows.filter(r => Number(r.Год) === y);
      const isOpen = !!expandedYears[y];

      let yearSum = 0;
      let paidBills = 0;
      const totalBills = yRows.length * 2;

      yRows.forEach(r => {
        const gSum = Number(r.Газ_Сумма) || 0;
        const tSum = (Number(r.Свет_Сумма) || 0) + (Number(r.Вода) || 0) + (Number(r.ТБО) || 0) + (Number(r.Полив) || 0);
        yearSum += (gSum + tSum);
        if (r.Газ_Оплата === 'Да') paidBills++;
        if (r.ТЭС_Оплата === 'Да') paidBills++;
      });

      // Строим все 12 месяцев года (с Января по Декабрь), включая еще не заполненные
      let monthsHtml = '';
      for (let mNum = 1; mNum <= 12; mNum++) {
        const mIdx = mNum - 1;
        const isSummer = mNum >= 5 && mNum <= 9;
        const r = yRows.find(item => Number(item.Месяц) === mNum);

        if (!r) {
          monthsHtml += `
            <div class="month-empty" onclick="editMonth(${y}, ${mNum})">
              <span class="month-empty-name">${MONTHS[mIdx]} ${isSummer ? '💧' : ''}</span>
              <span class="month-empty-hint">Нет данных • Нажмите для ввода</span>
            </div>
          `;
        } else {
          const gSum = Number(r.Газ_Сумма) || 0;
          const tSum = (Number(r.Свет_Сумма) || 0) + (Number(r.Вода) || 0) + (Number(r.ТБО) || 0) + (Number(r.Полив) || 0);
          const gPaid = r.Газ_Оплата === 'Да';
          const tPaid = r.ТЭС_Оплата === 'Да';

          monthsHtml += `
            <div class="month-card ${isSummer ? 'summer' : ''}">
              <div class="month-top">
                <span>${MONTHS[mIdx]} ${isSummer ? '💧' : ''}</span>
                <span class="month-edit-link" onclick="editMonth(${y}, ${mNum})">✏️ Изменить (${(gSum + tSum).toFixed(0)} ₽)</span>
              </div>
              <div class="bills-grid">
                <div class="bill-cell ${gPaid ? 'paid' : ''}" onclick="confirmJournalToggle(${y}, ${mNum}, 'gas', ${gPaid})">
                  <div>
                    <span class="bill-cell-title">Газ (${r.Газ_Расход} м³)</span>
                    <span class="bill-cell-sum">${gSum.toFixed(0)} ₽</span>
                  </div>
                  <span class="bill-cell-icon">${gPaid ? '✅' : '⬜'}</span>
                </div>
                <div class="bill-cell ${tPaid ? 'paid' : ''}" onclick="confirmJournalToggle(${y}, ${mNum}, 'tes', ${tPaid})">
                  <div>
                    <span class="bill-cell-title">ТЭС (${r.Свет_Расход} кВт)</span>
                    <span class="bill-cell-sum">${tSum.toFixed(0)} ₽</span>
                  </div>
                  <span class="bill-cell-icon">${tPaid ? '✅' : '⬜'}</span>
                </div>
              </div>
            </div>
          `;
        }
      }

      return `
        <div class="year-group">
          <div class="year-header" onclick="toggleYear(${y})">
            <div class="year-title">
              <span>${isOpen ? '📂' : '📁'} ${y} год</span>
            </div>
            <div class="year-meta">
              <strong>${yearSum.toFixed(2)} ₽</strong>
              <span>Оплачено счетов: ${paidBills} из ${totalBills} ${isOpen ? '▲' : '▼'}</span>
            </div>
          </div>
          <div class="year-body ${isOpen ? '' : 'hidden'}">
            ${monthsHtml}
          </div>
        </div>
      `;
    }).join('');
  }

  // Подтверждение при смене статуса в журнале
  async function confirmJournalToggle(year, month, service, isCurrentlyPaid) {
    const url = getApiUrl();
    if (!url) return;
    const serviceName = service === 'gas' ? 'Газпром' : 'Татэнергосбыт';
    const monthName = MONTHS[month - 1];
    const newValue = isCurrentlyPaid ? 'Нет' : 'Да';

    const msg = isCurrentlyPaid
      ? `Отменить оплату за ${monthName} ${year} (${serviceName}) и вернуть белый статус?`
      : `Отметить ${monthName} ${year} (${serviceName}) как ОПЛАЧЕННЫЙ (зелёным)?`;

    if (!confirm(msg)) return;

    const target = allRows.find(r => Number(r.Год) === year && Number(r.Месяц) === month);
    if (target) {
      if (service === 'gas') target.Газ_Оплата = newValue;
      else target.ТЭС_Оплата = newValue;
      renderJournal();
      if (Number(yearSel.value) === year && Number(monthSel.value) === month) {
        gasPaidState = target.Газ_Оплата === 'Да';
        tesPaidState = target.ТЭС_Оплата === 'Да';
        updatePayButtons();
      }
    }

    await fetch(url, {
      method: 'POST',
      body: JSON.stringify({ action: 'toggleStatus', year, month, service, value: newValue })
    });
  }

  async function saveRecord() {
    const url = getApiUrl();
    if (!url) return alert('Сначала вставьте Ключ в настройках!');

    const c = recalc();
    if (c.gTar) localStorage.setItem('last_gas_tariff', c.gTar);
    if (c.eTar) localStorage.setItem('last_elec_tariff', c.eTar);

    const btn = document.getElementById('saveBtn');
    btn.disabled = true;
    btn.innerText = 'Сохранение...';

    const payload = {
      year: yearSel.value,
      month: monthSel.value,
      gasReading: c.gRead,
      gasDiff: c.gDiff,
      gasTariff: c.gTar,
      gasSum: c.gSum.toFixed(2),
      gasPaid: gasPaidState,
      elecReading: c.eRead,
      elecDiff: c.eDiff,
      elecTariff: c.eTar,
      elecSum: c.eSum.toFixed(2),
      water: c.water,
      tbo: c.tbo,
      watering: c.watering,
      tesPaid: tesPaidState
    };

    try {
      await fetch(url, { method: 'POST', body: JSON.stringify(payload) });
      await loadData();
      alert('Данные сохранены!');
    } catch (e) {
      alert('Ошибка при сохранении');
    } finally {
      btn.disabled = false;
      btn.innerText = '💾 Сохранить данные за месяц';
    }
  }

  loadData();
</script>
</body>
